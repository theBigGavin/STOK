openapi: 3.0.3
info:
  title: 图表库迁移组件接口规范
  description: 定义从 Unovis 迁移到 Ant Design Charts 的组件接口规范
  version: 1.0.0

components:
  schemas:
    # 净值曲线数据模型
    EquityPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          description: 日期
        value:
          type: number
          description: 净值
      required:
        - date
        - value

    EquityCurve:
      type: object
      properties:
        name:
          type: string
          description: 曲线名称
        data:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
          description: 净值数据点
        color:
          type: string
          description: 曲线颜色 (CSS 颜色值)
      required:
        - name
        - data
        - color

    # 性能数据模型
    PerformanceMetrics:
      type: object
      properties:
        accuracy:
          type: number
          description: 准确率
          minimum: 0
          maximum: 1
        precision:
          type: number
          description: 精确率
          minimum: 0
          maximum: 1
        recall:
          type: number
          description: 召回率
          minimum: 0
          maximum: 1
        f1Score:
          type: number
          description: F1分数
          minimum: 0
          maximum: 1
        totalReturn:
          type: number
          description: 总收益率
        sharpeRatio:
          type: number
          description: 夏普比率
        maxDrawdown:
          type: number
          description: 最大回撤
          maximum: 0

    PerformanceHistory:
      type: object
      properties:
        date:
          type: string
          format: date
          description: 评估日期
        modelId:
          type: integer
          description: 模型ID
        modelName:
          type: string
          description: 模型名称
        metrics:
          $ref: "#/components/schemas/PerformanceMetrics"
      required:
        - date
        - modelId
        - modelName
        - metrics

    # 投票数据模型
    ModelDecision:
      type: object
      properties:
        modelId:
          type: integer
          description: 模型ID
        modelName:
          type: string
          description: 模型名称
        decision:
          type: string
          enum: [BUY, SELL, HOLD]
          description: 决策类型
        confidence:
          type: number
          description: 置信度
          minimum: 0
          maximum: 1
        signalStrength:
          type: number
          description: 信号强度
          minimum: -1
          maximum: 1
      required:
        - modelId
        - modelName
        - decision
        - confidence
        - signalStrength

    VoteData:
      type: object
      properties:
        decision:
          type: string
          enum: [BUY, SELL, HOLD]
          description: 决策类型
        count:
          type: integer
          description: 票数
          minimum: 0
        percentage:
          type: number
          description: 百分比
          minimum: 0
          maximum: 100
        color:
          type: string
          description: 颜色 (CSS 颜色值)
      required:
        - decision
        - count
        - percentage
        - color

    # 图表配置模型
    ChartConfig:
      type: object
      properties:
        data:
          type: array
          description: 图表数据
        xField:
          type: string
          description: X轴字段名
        yField:
          type: string
          description: Y轴字段名
        seriesField:
          type: string
          description: 系列字段名
        color:
          oneOf:
            - type: string
              description: 固定颜色
            - type: array
              items:
                type: string
              description: 颜色数组
        smooth:
          type: boolean
          description: 是否平滑曲线
        tooltip:
          type: object
          description: 提示框配置
        legend:
          type: object
          description: 图例配置
        interactions:
          type: array
          items:
            type: object
          description: 交互配置

  responses:
    ChartError:
      description: 图表渲染错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: 错误信息
              component:
                type: string
                description: 组件名称
              timestamp:
                type: string
                format: date-time
                description: 错误时间

  parameters:
    TimeRange:
      name: timeRange
      in: query
      description: 时间范围
      schema:
        type: string
        enum: [1d, 1w, 1m, 3m, 1y, all]
        default: 1m

    MetricType:
      name: metric
      in: query
      description: 指标类型
      schema:
        type: string
        enum:
          [
            accuracy,
            precision,
            recall,
            f1Score,
            totalReturn,
            sharpeRatio,
            maxDrawdown,
          ]
        default: totalReturn

    ChartType:
      name: chartType
      in: query
      description: 图表类型
      schema:
        type: string
        enum: [line, area, bar, pie, scatter]
        default: line

paths:
  # 净值曲线图表组件接口
  /components/charts/equity-curve:
    get:
      summary: 获取净值曲线图表配置
      description: 根据净值曲线数据生成 Ant Design Charts 配置
      parameters:
        - $ref: "#/components/parameters/TimeRange"
      responses:
        "200":
          description: 成功返回图表配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartConfig"
        "400":
          $ref: "#/components/responses/ChartError"

  # 性能趋势图表组件接口
  /components/charts/performance:
    get:
      summary: 获取性能趋势图表配置
      description: 根据性能数据生成 Ant Design Charts 配置
      parameters:
        - $ref: "#/components/parameters/TimeRange"
        - $ref: "#/components/parameters/MetricType"
      responses:
        "200":
          description: 成功返回图表配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartConfig"
        "400":
          $ref: "#/components/responses/ChartError"

  # 投票分布图表组件接口
  /components/charts/vote:
    get:
      summary: 获取投票分布图表配置
      description: 根据投票数据生成 Ant Design Charts 配置
      parameters:
        - $ref: "#/components/parameters/ChartType"
      responses:
        "200":
          description: 成功返回图表配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartConfig"
        "400":
          $ref: "#/components/responses/ChartError"

  # 价格走势图表组件接口
  /components/charts/price:
    get:
      summary: 获取价格走势图表配置
      description: 根据价格数据生成 Ant Design Charts 配置
      parameters:
        - $ref: "#/components/parameters/TimeRange"
        - $ref: "#/components/parameters/ChartType"
      responses:
        "200":
          description: 成功返回图表配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartConfig"
        "400":
          $ref: "#/components/responses/ChartError"
